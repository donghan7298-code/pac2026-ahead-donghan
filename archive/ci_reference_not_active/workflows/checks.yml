name: planner-checks
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'refactor/**', 'test/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m pac_planning.demo --model models/dual_head_ranker.json --fixed-work --output runs/ci
