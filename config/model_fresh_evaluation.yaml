  boxes_per_scenario: 24
  seed: 20261109
collection:
  workers: 4
  episode_seeds: [7]
  mixed_behaviour: true
  spec_mismatch_probability: 0.02
  missing_probability: 0.02
training:
  model_seeds: [7, 17]
  epochs: 100
  hidden: 64
  batch_queries: 8
  patience: 20
