schema_version: 1
data:
  sample_per_family: 6              # six families -> 36 scenarios, 864 source boxes
  boxes_per_scenario: 24
  seed: 20261009
collection:
  workers: 2
  episode_seeds: [7]                # benchmark preset adds repeated measurement draws
  mixed_behaviour: true
  spec_mismatch_probability: 0.02
  missing_probability: 0.02
training:
  model_seeds: [7, 17]
  epochs: 100
  hidden: 64
  batch_queries: 8
  patience: 20
  learning_rate: 0.002
evaluation:
  robot_config: robot_check_gazebo.yaml
  episode_seeds: [101, 102, 103]
  variants: [clean, nominal, noisy3mm]
planning:
  top_k: 4
  scenario_count: 3
  horizon: 2
  rollout_candidate_limit: 16
